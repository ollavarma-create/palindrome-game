name: Build Nuitka EXE for Windows and Linux AppImage

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify file path
        run: |
          Get-ChildItem -Recurse
          if (Test-Path -Path "PalindromeGame.py") {
              Write-Output "File exists"
          } else {
              Write-Output "File does not exist"
              exit 1
          }
          if (Test-Path -Path "palindromes.json") {
              Write-Output "palindromes.json exists"
          } else {
              Write-Output "palindromes.json does not exist"
              exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install nuitka==4.3.5 pyqt6 matplotlib nltk pandas requests appdirs
      - name: Build with Nuitka
        shell: cmd
        run: |
          python -m nuitka PalindromeGame.py --include-data-files=palindromes.json=palindromes.json --standalone --onefile --follow-imports --enable-plugin=pyqt6 --output-dir=build --windows-console-mode=disable --experimental=force-dependencies-pefile --msvc=latest < NUL
      - name: Upload .exe as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PalindromeGame-Windows
          path: build/PalindromeGame.exe
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify file path
        run: |
          find .
          if [ -f "PalindromeGame.py" ]; then
              echo "File exists"
          else
              echo "File does not exist"
              exit 1
          fi
          if [ -f "palindromes.json" ]; then
              echo "palindromes.json exists"
          else
              echo "palindromes.json does not exist"
              exit 1
          fi
          if [ -f "assets/palindromegame.png" ]; then
              echo "Icon exists"
          else
              echo "ERROR: Icon 'assets/palindromegame.png' not found"
              exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf desktop-file-utils libgirepository1.0-dev libfuse2 imagemagick libfreetype6-dev libpng-dev libqt6core6 libqt6gui6 libqt6widgets6
          pip install nuitka==4.3.5 pyqt6 matplotlib nltk pandas requests appdirs
          pip list | grep -E "nuitka|pyqt6|matplotlib|nltk|pandas|requests|appdirs"
      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('words', download_dir='nltk_data', quiet=True)"
          ls -R nltk_data
      - name: Build with Nuitka
        run: |
          python -m nuitka PalindromeGame.py \
            --include-data-files=palindromes.json=palindromes.json \
            --include-data-dir=nltk_data=nltk_data \
            --standalone \
            --onefile \
            --follow-imports \
            --enable-plugin=pyqt6 \
            --output-dir=build \
            --include-module=appdirs,matplotlib,nltk </dev/null
      - name: Verify build output
        run: |
          ls -la build/
      - name: Install verified AppImage packaging tools
        run: |
          set -euo pipefail

          TOOL_VERSION="1.9.1"
          TOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

          RUNTIME_VERSION="20251108"
          RUNTIME_SHA256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${TOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool.AppImage

          printf '%s  %s\n' "$TOOL_SHA256" /tmp/appimagetool.AppImage | sha256sum -c -

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_VERSION}/runtime-x86_64" \
            -o /tmp/appimage-runtime-x86_64

          printf '%s  %s\n' "$RUNTIME_SHA256" /tmp/appimage-runtime-x86_64 | sha256sum -c -

          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null)

          sudo install -m 0755 /tmp/squashfs-root/usr/bin/appimagetool /usr/local/bin/appimagetool

          echo "APPIMAGE_RUNTIME_FILE=/tmp/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          cp build/PalindromeGame.bin AppDir/usr/bin/palindromegame
          chmod +x AppDir/usr/bin/palindromegame
          cp palindromes.json AppDir/palindromes.json
          cp -r nltk_data AppDir/nltk_data
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          echo "Running palindromegame from $HERE/usr/bin/palindromegame" >&2
          exec "$HERE/usr/bin/palindromegame" "$@" 2> "/tmp/palindromegame_error.log"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/palindromegame.desktop << EOF
          [Desktop Entry]
          Name=PalindromeGame
          Exec=/usr/bin/palindromegame
          Icon=palindromegame
          Type=Application
          Categories=Utility;
          EOF
          cp assets/palindromegame.png AppDir/palindromegame.png
          find AppDir -type f | sort
      - name: Build AppImage
        run: |
          set -euo pipefail

          : "${APPIMAGE_RUNTIME_FILE:?Verified runtime is required}"
          test -s "$APPIMAGE_RUNTIME_FILE"

          ARCH=x86_64 appimagetool \
            --runtime-file "$APPIMAGE_RUNTIME_FILE" \
            AppDir PalindromeGame-x86_64.AppImage

          test -s PalindromeGame-x86_64.AppImage
          chmod +x PalindromeGame-x86_64.AppImage
      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PalindromeGame-Linux
          path: PalindromeGame-x86_64.AppImage

  publish-release:
    if: github.event_name == 'release'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PalindromeGame-Windows
          path: release/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PalindromeGame-Linux
          path: release/linux

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/windows/PalindromeGame.exe
            release/linux/PalindromeGame-x86_64.AppImage
